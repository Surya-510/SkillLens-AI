spring.application.name=skilllens-ai

spring.datasource.url=jdbc:mysql://localhost:3306/skilllens_db
spring.datasource.username=root
spring.datasource.password=----

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=INFO

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:latest
spring.ai.ollama.chat.options.temperature=0.2 
spring.ai.ollama.chat.options.num-predict=1500

skilllens.admin.username=admin
skilllens.admin.password=----
